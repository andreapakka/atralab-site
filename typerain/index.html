<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="TypeRain: digita le parole prima che raggiungano il fondo!">
  <title>TypeRain · ATRALAB</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/internal.css">
  <link rel="stylesheet" href="/css/typerain.css">
  <script defer src="/js/include.js"></script>
  <script defer src="/js/typerain.js"></script>
</head>
<body>
  <header data-include="/components/header.html"></header>
  <div class="internal-layout">
    <aside data-include="/components/sidebar.html"></aside>
    <main class="internal-main tr-main" id="tr-main">
      <section class="tr-intro"><div class="tr-intro-title"><p class="tr-kicker">ATRALAB / GIOCHI</p><h1>TypeRain</h1></div><p>Digita le parole prima che tocchino terra!</p></section>
      <section class="tr-panel" aria-labelledby="tr-settings-title">
        <h2 id="tr-settings-title">Prepara la manche</h2>
        <p id="tr-load-state" role="status">Caricamento del dizionario…</p>
        <form id="tr-settings" class="tr-form" hidden>
          <label>Tema <select id="tr-theme" required></select></label>
          <label>Difficoltà <select id="tr-level" required></select></label>
          <label>Numero di parole <select id="tr-count" required></select></label>
          <label>Parole contemporanee <select id="tr-simultaneous" required></select></label>
          <div class="tr-options"><label class="tr-check"><input type="checkbox" id="tr-hide-progress"> Nascondi lettere digitate</label>
          <label class="tr-check"><input type="checkbox" id="tr-sounds" checked> Effetti sonori</label></div>
          <div class="tr-info"><p id="tr-available" class="tr-muted" role="status"></p><p id="tr-record" class="tr-record"></p></div>
          <button class="tr-primary" type="submit">GIOCA →</button>
        </form>
      </section>
    </main>
  </div>
  <footer data-include="/components/footer.html"></footer>
  <section id="tr-game" class="tr-game" hidden aria-label="Partita TypeRain">
    <div class="tr-topbar"><strong>TypeRain</strong><span id="tr-summary"></span><strong id="tr-score">0 PT</strong><button id="tr-pause" class="tr-quiet" type="button">Pausa</button><button id="tr-sound-toggle" class="tr-quiet" type="button" aria-label="Attiva o disattiva suoni">Suono</button></div>
    <div class="tr-track"><div id="tr-progressbar"></div></div>
    <div id="tr-field" class="tr-field" aria-label="Parole in caduta"><div class="tr-floor"></div><div id="tr-countdown" class="tr-center-message" hidden></div><div id="tr-pause-screen" class="tr-center-message tr-pause-screen" hidden><strong>IN PAUSA</strong><button id="tr-resume" class="tr-primary" type="button">Riprendi</button><button id="tr-quit" class="tr-quiet" type="button">Esci dalla manche</button></div></div>
    <div class="tr-bottom"><span id="tr-counter">0 / 0 parole</span><span id="tr-success">Completate 0 · Perse 0</span><span class="tr-tip">ESC = pausa</span></div>
    <input id="tr-keyboard" class="tr-keyboard" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text" aria-label="Digita le parole">
  </section>
  <section id="tr-results" class="tr-results" hidden aria-label="Risultato manche">
    <div class="tr-results-card"><p class="tr-kicker">MANCHE TERMINATA</p><h2>Ottimo lavoro!</h2><p id="tr-final-score" class="tr-bigscore"></p><p id="tr-final-stats"></p><p id="tr-final-record"></p><div class="tr-results-actions"><button id="tr-replay" class="tr-primary">RIGIOCA</button><button id="tr-new" class="tr-secondary">NUOVA MANCHE</button></div></div>
  </section>
</body>
</html>
