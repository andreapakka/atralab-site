<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>PhotoFlow · ATRALAB</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/internal.css"><link rel="stylesheet" href="/photoflow/style.css"><script defer src="/js/include.js"></script><script defer src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.6/Sortable.min.js"></script><script defer src="/photoflow/config.js"></script><script defer src="/photoflow/music-catalog.js"></script><script defer src="/photoflow/storage.js"></script><script defer src="/photoflow/images.js"></script><script defer src="/photoflow/player.js"></script><script defer src="/photoflow/photoflow.js"></script></head><body><header data-include="/components/header.html"></header><div class="internal-layout"><aside data-include="/components/sidebar.html"></aside><main class="internal-main pf-main"><header class="pf-head"><div><small>ATRALAB / UTILITY</small><h1>PhotoFlow</h1><p>Le tue fotografie, in movimento.</p></div><span id="pf-usage"></span></header><nav class="pf-tabs"><button id="pf-tab-list" class="active">I miei slideshow</button><button id="pf-tab-editor">Editor</button></nav><p id="pf-status" role="status" aria-live="polite">Caricamento…</p><section id="pf-list"><div class="pf-row"><strong id="pf-count"></strong><label id="pf-admin" hidden><input type="checkbox" id="pf-mine"> Solo i miei</label><button id="pf-new" class="pf-primary">+ Nuovo slideshow</button></div><div id="pf-library"></div><div class="pf-row" id="pf-pages" hidden><button id="pf-prev-page">Indietro</button><span id="pf-page"></span><button id="pf-next-page">Avanti</button></div></section><section id="pf-editor" hidden><div class="pf-row"><label class="pf-grow">Nome slideshow<input id="pf-title" maxlength="80" placeholder="Nome dello slideshow"></label><button id="pf-create" class="pf-primary">Crea</button><button id="pf-play" class="pf-primary" hidden>▶ Play</button><span id="pf-saved"></span></div><div id="pf-existing" hidden><details><summary>Impostazioni riproduzione</summary><div class="pf-fields"><label>Durata foto (s)<input type="number" id="photoSeconds"></label><label>Transizione (s)<input type="number" id="transitionSeconds" step="0.5"></label><label>Tipo transizione<select id="transition"></select></label><label>Adattamento<select id="fit"><option value="contain">Adatta</option><option value="cover">Riempi</option></select></label><label>Colore sfondo<input type="color" id="background"><span id="pf-colors"></span></label><label><input type="checkbox" id="loop"> Ripeti slideshow</label></div></details><details><summary>Musica di sottofondo</summary><div class="pf-fields"><label>Brano<select id="musicId"><option value="">Nessuna musica</option></select></label><button id="pf-listen">Ascolta</button><label>Volume <output id="pf-volume-label">30%</output><input id="volume" type="range" min="0" max="100" step="1"></label><label>Anticipo musica (s)<input id="musicLeadSeconds" type="number" step="1"></label><label><input type="checkbox" id="musicLoop"> Ripeti musica</label></div><p id="pf-credit"></p><small>Brani esterni, disponibilità soggetta alla sorgente. <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a></small></details><div id="pf-drop" tabindex="0" role="button"><strong>Trascina qui le fotografie</strong><button id="pf-browse">Seleziona foto</button><input id="pf-files" type="file" multiple accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.heic,.heif" hidden></div><div class="pf-row"><span id="pf-photo-count"></span><button id="pf-cancel" hidden>Annulla caricamento</button><button id="pf-reload">Ricarica</button></div><div id="pf-photos" class="pf-photos"></div></div></section><section id="pf-player" hidden tabindex="0"><div id="pf-stage"><img alt="" id="pf-layer-a"><img alt="" id="pf-layer-b"><div id="pf-message" role="status"></div></div><div id="pf-controls"><button id="pf-back" aria-label="Foto precedente">⏮</button><button id="pf-toggle">Pausa</button><button id="pf-next" aria-label="Foto successiva">⏭</button><span id="pf-position"></span><label id="pf-player-audio">Volume <input id="pf-live-volume" type="range" min="0" max="100" aria-label="Volume"></label><button id="pf-audio-retry" hidden>Attiva musica</button><button id="pf-full">⛶ Schermo intero</button><button id="pf-close">Chiudi</button></div><small id="pf-player-credit"></small></section><dialog id="pf-preview"><button id="pf-preview-close">Chiudi</button><img id="pf-preview-image" alt="Anteprima fotografia"></dialog></main></div><footer data-include="/components/footer.html"></footer></body></html>
