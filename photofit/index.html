<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>PhotoFit · ATRALAB</title>
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/internal.css"><link rel="stylesheet" href="/photofit/style.css">
<script defer src="/js/include.js"></script><script defer src="/js/vendor/jszip.min.js"></script><script defer src="/photofit/config.js"></script><script type="module" src="/photofit/photofit.js"></script></head>
<body><header data-include="/components/header.html"></header><div class="internal-layout"><aside data-include="/components/sidebar.html"></aside><main class="internal-main pf-main">
<header class="pf-heading"><p class="pf-kicker">ATRALAB / UTILITY</p><h1>PhotoFit</h1><p>Ridimensiona, centra e ritaglia le tue fotografie.</p></header>
<div id="pf-status" class="pf-notice" role="status" aria-live="polite">Caricamento…</div>
<div class="pf-row pf-usage"><span id="pf-usage"></span><button id="pf-refresh" type="button">Aggiorna</button></div>
<nav class="pf-tabs" aria-label="Sezioni PhotoFit"><button id="pf-pending-tab" aria-pressed="true">Da lavorare</button><button id="pf-completed-tab" aria-pressed="false">Archivio</button></nav>
<section id="pf-pending" class="pf-panel"><div id="pf-drop" class="pf-drop" tabindex="0" role="button" aria-label="Carica fotografie"><strong>Trascina qui le fotografie</strong><span>JPEG o PNG · anche più foto alla volta</span><button id="pf-browse" type="button">Seleziona foto</button><input id="pf-files" type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png" multiple hidden></div><p class="pf-hint">Le foto caricate restano disponibili anche dopo aver chiuso la pagina.</p><label id="pf-pending-admin-filter" hidden><input type="checkbox" id="pf-pending-mine" checked> Solo le mie</label><div id="pf-pending-grid" class="pf-grid"></div></section>
<section id="pf-completed" class="pf-panel" hidden><div class="pf-row"><label id="pf-admin-filter" hidden><input type="checkbox" id="pf-mine" checked> Solo le mie</label><button id="pf-all">Seleziona tutte</button><button id="pf-none">Deseleziona</button><button id="pf-zip" class="pf-primary" disabled>Scarica ZIP</button><span id="pf-count"></span></div><div id="pf-completed-grid" class="pf-grid"></div></section>
</main></div><footer data-include="/components/footer.html"></footer>
<dialog id="pf-editor" class="pf-dialog pf-editor"><div class="pf-editor-shell"><div class="pf-row pf-editor-head"><strong>PhotoFit — Editor</strong><span id="pf-editor-name" class="pf-filename"></span><button id="pf-fullscreen">Schermo intero</button><button id="pf-close">Chiudi</button></div>
<div class="pf-fields"><label>Unità<select id="pf-unit"><option value="cm">cm</option><option value="px">px</option></select></label><label>Larghezza<input id="pf-width" type="number" min="0.0001" step="any" inputmode="decimal"></label><label>Altezza<input id="pf-height" type="number" min="0.0001" step="any" inputmode="decimal"></label><label>DPI<input id="pf-dpi" type="number" min="1" max="65535" step="1" inputmode="numeric"></label><span id="pf-output-size" class="pf-hint"></span></div>
<div class="pf-canvas-wrap" id="pf-canvas-wrap"><canvas id="pf-canvas" aria-label="Area di ritaglio: trascina per spostare la fotografia"></canvas></div>
<div class="pf-tools"><label>Zoom foto <input id="pf-photo-zoom" type="range" min="1" step="0.01"><output id="pf-zoom-value"></output></label><label>Zoom area <input id="pf-view-zoom" type="range" min="1" step="0.05"><output id="pf-view-value"></output></label><div class="pf-row"><button id="pf-left">−90°</button><label>Rotazione <input id="pf-angle" type="range" min="-180" max="180" step="0.1"><output id="pf-angle-value"></output></label><button id="pf-right">+90°</button></div><div class="pf-row"><label><input id="pf-grid-toggle" type="checkbox"> Griglia</label><button id="pf-center">Centra</button><button id="pf-reset">Ripristina</button></div></div>
<div id="pf-editor-status" role="status" class="pf-notice" hidden></div><div class="pf-row pf-editor-actions"><button id="pf-preview" class="pf-primary">Anteprima e salva</button></div></div></dialog>
<dialog id="pf-preview-dialog" class="pf-dialog pf-preview"><h2 id="pf-preview-title">Anteprima</h2><img id="pf-preview-img" alt="Fotografia risultante"><p id="pf-preview-meta" class="pf-hint"></p><div id="pf-preview-status" class="pf-notice" role="status" hidden></div><div class="pf-row"><button id="pf-preview-back">Chiudi</button><button id="pf-save" class="pf-primary">Salva definitivamente</button></div></dialog>
</body></html>
